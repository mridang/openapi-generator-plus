name: Run Tests

on: pull_request

permissions:
  contents: read

defaults:
  run:
    working-directory: ./

jobs:
  app-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Runner Common Setup
        uses: mridang/action-runner-common@v1
        with:
          # Polyglot test matrix pulls ~12 GB of language images during the
          # job. Free runner bloat (Android SDK, .NET, Haskell, CodeQL,
          # PyPy, etc.) up front so the post-step bin-pack has room to
          # actually save those images to cache.
          docker-cache-free-disk: 'true'

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: ./docker_images
          key: ${{ runner.os }}-docker-${{ hashFiles('docker-compose.yml') }}
          restore-keys: |
            ${{ runner.os }}-docker-

#      - name: Docker pull
#        run: |
#          IMAGES_DIR="./docker_images"
#          COMBINED_IMAGES_TAR="$IMAGES_DIR/combined_images.tar"
#
#          if [ -f "$COMBINED_IMAGES_TAR" ]; then
#          docker image load -i "$COMBINED_IMAGES_TAR"
#          else
#          mkdir -p "$IMAGES_DIR"
#          IMAGES=$(docker compose config --images)
#          docker pull $IMAGES
#          docker image save -o "$COMBINED_IMAGES_TAR" $IMAGES
#          fi

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven

      - name: Install Dependencies
        run: mvn --batch-mode --show-version dependency:go-offline

      - name: Start profiling sampler
        run: |
          mkdir -p "$RUNNER_TEMP/spike"
          setsid nohup .github/spike/sampler.sh "$RUNNER_TEMP/spike" > "$RUNNER_TEMP/spike/sampler.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/spike/sampler.pid"
          date +%s > "$RUNNER_TEMP/spike/mvn-start"

      - name: Run Junit
        shell: bash
        run: |
          set -o pipefail
          mvn verify --batch-mode 2>&1 | perl -MTime::HiRes=time -pe 'BEGIN{$|=1} $_=sprintf("%.3f %s",time,$_)' | tee "$RUNNER_TEMP/spike/mvn-timestamped.log"

      - name: Stop sampler and summarise
        if: always()
        run: |
          kill -- -"$(cat "$RUNNER_TEMP/spike/sampler.pid")" 2>/dev/null || pkill -f sampler.sh || true
          cd "$RUNNER_TEMP/spike"
          grep -E 'Running |Tests run:.*Time elapsed|--- |BUILD|Total time|Pulling|Starting' mvn-timestamped.log > phases.log || true
          {
            echo '## Profiling summary'
            python3 "$GITHUB_WORKSPACE/.github/spike/summarize.py" "$RUNNER_TEMP/spike"
            echo
            echo 'Phase boundaries are in phases.log of the spike-profile artifact.'
            nproc
            free -m | head -2
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload profiling data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-profile
          path: ${{ runner.temp }}/spike

      - name: Generate coverage report
        if: always()
        uses: mridang/action-test-reporter@v3
        with:
          results-path: 'target/surefire-reports/*.xml'
          coverage-path: 'target/coverage/jacoco.xml'
