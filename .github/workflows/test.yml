name: Run Tests

on: push

permissions:
  contents: write

defaults:
  run:
    working-directory: ./

jobs:
  app-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Runner Common Setup (test branch)
        uses: mridang/action-runner-common@09c9da927e668e949e3d084aa6caf2b0fef171ad
        with:
          docker-cache-free-disk: 'true'

      - name: Synthetic root-owned files in ~/.cache (validates sudo tar path)
        run: |
          # Simulate what containers running as root + bind-mount would
          # produce: files in ~/.cache owned by root that the runner user
          # cannot read. If our post-step's sudo tar works, these files
          # should be included in the cache; if it falls back to plain
          # tar, they will be silently skipped.
          sudo mkdir -p "$HOME/.cache/synthetic-root-owned"
          echo "secret-from-root-$(date +%s%N)" | sudo tee "$HOME/.cache/synthetic-root-owned/marker.txt" > /dev/null
          sudo chmod 0600 "$HOME/.cache/synthetic-root-owned/marker.txt"
          sudo chown -R root:root "$HOME/.cache/synthetic-root-owned"
          echo "--- ls -la as runner ---"
          ls -la "$HOME/.cache/synthetic-root-owned" || true
          echo "--- cat as runner (should fail with permission denied) ---"
          cat "$HOME/.cache/synthetic-root-owned/marker.txt" 2>&1 || echo "expected: permission denied"

      - name: Free disk space (GitHub runner ~14GB; we pull 12 lang Docker images during tests)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: ./docker_images
          key: ${{ runner.os }}-docker-${{ hashFiles('docker-compose.yml') }}
          restore-keys: |
            ${{ runner.os }}-docker-

#      - name: Docker pull
#        run: |
#          IMAGES_DIR="./docker_images"
#          COMBINED_IMAGES_TAR="$IMAGES_DIR/combined_images.tar"
#
#          if [ -f "$COMBINED_IMAGES_TAR" ]; then
#          docker image load -i "$COMBINED_IMAGES_TAR"
#          else
#          mkdir -p "$IMAGES_DIR"
#          IMAGES=$(docker compose config --images)
#          docker pull $IMAGES
#          docker image save -o "$COMBINED_IMAGES_TAR" $IMAGES
#          fi

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: maven

      - name: Install Dependencies
        run: mvn --batch-mode --show-version dependency:go-offline

      - name: Run Junit
        run: mvn verify --batch-mode

      - name: Generate coverage report
        if: always()
        uses: mridang/action-test-reporter@v3
        with:
          results-path: 'target/surefire-reports/*.xml'
          coverage-path: 'target/coverage/jacoco.xml'
