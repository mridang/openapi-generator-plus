openapi: 3.0.3

# A deliberately adversarial second spec, generated alongside the petstore one.
#
# Its first job is to prove that NOTHING from the petstore spec leaks into a
# generated SDK. Because this spec shares no vocabulary with petstore, any
# occurrence of "pet", "petstore", "Swatch", "PhotoMetadata" and friends in the
# output is, by construction, a literal hardcoded in a template rather than
# something derived from the spec being generated.
#
# Its second job is to carry the shapes petstore happens not to have, each of
# which hid a real bug behind a green test suite:
#
#   - a tag whose name STARTS WITH AN ACRONYM, so camelCase conversion is forced
#     to fold the whole run (RELAYService -> relayService, never rELAYService)
#   - a property typed as a MAP OF BYTE ARRAYS, which must not be mistaken for a
#     collection of them when generating equality
#   - a schema whose name EQUALS the root package/namespace, which makes a
#     language bind an unqualified reference to the type instead of the namespace
#   - a global security requirement alongside an operation that opts out with an
#     explicit `security: []`, so inherited and unauthenticated operations are
#     told apart
info:
  # Ends in "SDK" on purpose. Templates append a suffix of their own, which
  # reads correctly only while the title does not already end that way, and
  # the petstore title does not — so "Zitadel SDK" shipped documents headed
  # "Zitadel SDK SDK". See AppNameBaseTest and generatedDocsDoNotDoubleTheSdkSuffix.
  title: Probe Fixture SDK
  description: A synthetic fixture used to police generator output. Not a real API.
  version: 1.0.0

servers:
  - url: https://probe.example.invalid

security:
  - probeBearer: []

paths:
  /probe.v1.RELAYService/StoreVault:
    post:
      tags: [RELAYService]
      operationId: storeVault
      summary: Stores a vault and echoes it back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vault'
      responses:
        '200':
          description: The stored vault.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vault'

  /probe.v1.RELAYService/DescribeProbe:
    post:
      tags: [RELAYService]
      operationId: describeProbe
      summary: Returns fixture metadata. Explicitly unauthenticated.
      security: []
      responses:
        '200':
          description: Fixture metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probe'

  /probe.v1.RELAYService/LookupProbe:
    get:
      tags: [RELAYService]
      operationId: lookupProbe
      summary: Looks a probe up by a required query parameter that may be null.
      parameters:
        - name: marker
          in: query
          required: true
          schema:
            type: string
            nullable: true
      responses:
        '200':
          description: The probe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Probe'
  /probe.v1.RELAYService/Feed/{feedId}:
    get:
      tags: [RELAYService]
      operationId: followFeed
      summary: Follows a feed as server-sent events with a JSON payload.
      parameters:
        - name: feedId
          in: path
          required: true
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: One event per entry.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/Probe'

  /probe.v1.RELAYService/Ledger:
    get:
      tags: [RELAYService]
      operationId: readLedger
      summary: Reads the ledger as JSON Lines.
      responses:
        '200':
          description: One entry per line.
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/Probe'

  /probe.v1.RELAYService/Blob/{blobId}:
    put:
      tags: [RELAYService]
      operationId: replaceBlob
      summary: Replaces a blob with a raw body and returns the stored bytes.
      parameters:
        - name: blobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The stored bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /probe.v1.RELAYService/Records:
    get:
      tags: [RELAYService]
      operationId: listRecords
      summary: Lists records one page at a time with a page token.
      parameters:
        - name: page_size
          in: query
          schema:
            type: integer
            format: int32
        - name: page_token
          in: query
          schema:
            type: string
      responses:
        '200':
          description: One page of records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordPage'

components:
  securitySchemes:
    probeBearer:
      type: http
      scheme: bearer

  schemas:
    # Deliberately named after the root package so an unqualified reference to
    # a namespace member has to compete with this type during name resolution.
    Probe:
      type: object
      properties:
        label:
          type: string
        revision:
          type: integer
          format: int64
        grade:
          $ref: '#/components/schemas/Grade'

    RecordPage:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/Probe'
        next_page_token:
          type: string

    Grade:
      type: string
      enum:
        - first
        - second
        - third
      x-enum-varnames:
        - Gold
        - Silver
        - Bronze
      x-enumDescriptions:
        - The best grade.
        - The middle grade.
        - The last grade.
      x-enumnames:
        first: Ignored

    Vault:
      type: object
      properties:
        seal:
          description: A bare byte array; equality compares its contents.
          type: string
          format: byte
        shards:
          description: A list of byte arrays; equality compares element contents.
          type: array
          items:
            type: string
            format: byte
        labels:
          description: A map of byte arrays; equality compares each value's contents.
          type: object
          additionalProperties:
            type: string
            format: byte

    Tally:
      description: A model whose extra keys are typed integers (typed additionalProperties).
      type: object
      properties:
        label:
          type: string
      additionalProperties:
        type: integer
        format: int32

    # The OAS 3.0 spellings the 3.1 petstore cannot carry: `nullable: true` on
    # required and optional properties, with and without a default, and the
    # boolean forms of exclusiveMinimum and exclusiveMaximum. 3.1 spells the
    # first as a type array and the others as numbers.
    Gauge:
      type: object
      required: [needle, dial]
      properties:
        needle:
          type: string
          nullable: true
        dial:
          type: integer
          format: int32
          nullable: true
          default: 7
        bezel:
          type: string
          nullable: true
        crown:
          type: string
          nullable: true
          default: sapphire
        span:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          maximum: 100
          exclusiveMaximum: true
