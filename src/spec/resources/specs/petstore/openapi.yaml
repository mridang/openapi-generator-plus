openapi: 3.1.0
info:
  title: Swagger Petstore - OpenAPI 3.0
  summary: Pets, owners and orders for integration tests
  description: "A simplified Pet Store API for integration testing. Covers pets & owners, <admin> notes, \"quoted\" text, it's $USD and #{x}."
  termsOfService: https://example.com/terms
  contact:
    name: Petstore API support
    url: https://example.com/support
    email: support@example.com
  license:
    name: Apache 2.0
    identifier: Apache-2.0
  version: 1.0.0
tags:
  - name: pet
    description: |
      Everything about your Pets
      (globs like /pets/* and /pets/**/ and an id of #{petId})
    externalDocs:
      description: "Find out more about pets (it's */ here)\non two lines"
      url: https://example.com/docs/pets
  - name: store
    description: Access to Petstore orders
  - name: problems
    description: Operations that declare typed error responses
servers:
  - url: /api/v3
    description: Relative URL (no variables)
  - url: https://{environment}.example.com/api/{version}
    description: Main API server with variables
    variables:
      environment:
        default: api
        description: API environment
        enum:
          - api
          - staging
          - sandbox
      version:
        default: v3
        description: API version
        enum:
          - v2
          - v3
  # Third entry, appended so Server0/Server1 keep their indexes. Its text is
  # deliberately hostile to every language's string-literal and comment syntax
  # (quotes, backslashes, interpolation sigils, comment terminators, entities).
  - url: https://{tenant}.example.com/api
    description: "Bob's \"sandbox\" & co: $5 #{x} a*/b"
    variables:
      tenant:
        default: "o'neil"
        description: "Tenant's \"id\""
        enum:
          - "o'neil"
          - "a&b"
paths:

  # ─── Pet CRUD ────────────────────────────────────────────────────────────────

  /pet:
    post:
      tags:
        - pet
      summary: Add a new pet to the store
      operationId: addPet
      security:
        - apiKeyHeader: []
        - petStoreBearer: []
      requestBody:
        description: Create a new pet in the store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid input

  /pet/findByStatus:
    get:
      tags:
        - pet
      summary: Finds Pets by status
      operationId: findPetsByStatus
      deprecated: true
      externalDocs:
        description: Find out more about filtering
        url: https://example.com/docs/filtering
      parameters:
        - name: status
          in: query
          description: Status values that need to be considered for filter
          required: false
          deprecated: true
          allowEmptyValue: true
          schema:
            type: string
            default: available
            enum:
              - available
              - pending
              - sold
          examples:
            available_only:
              summary: Available only
              description: Show only pets currently in stock
              value: available
            sold_pets:
              summary: Sold pets
              description: Show pets that have been sold
              value: sold
        - name: filter
          in: query
          description: Filter criteria as key-value pairs
          required: false
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
        # Case 14 — format:date (date-only) params in query and header. A
        # date-only value must serialize as YYYY-MM-DD with no time component,
        # in every SDK, regardless of whether the language shares one type for
        # date and date-time.
        - name: bornAfter
          in: query
          description: Only return pets born on or after this date
          required: false
          schema:
            type: string
            format: date
        - name: Report-Date
          in: header
          description: Reference date for the report
          required: false
          schema:
            type: string
            format: date
        # Digit-leading parameter name: the sanitised identifier needs a
        # deterministic legal fallback in every SDK, while the wire name stays
        # `2ndPage`.
        - name: 2ndPage
          in: query
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid status value

  # Case 15 — format:date (date-only) PATH param. Must serialize as
  # YYYY-MM-DD in the path segment, with no time component, in every SDK.
  /pet/born-on/{bornOn}:
    get:
      tags:
        - pet
      summary: List pets born on a given date
      operationId: findPetsBornOn
      parameters:
        - name: bornOn
          in: path
          required: true
          description: Date of birth to match
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'

  /pet/{petId}:
    get:
      tags:
        - pet
      summary: Find pet by ID
      description: Returns a single pet
      operationId: getPetById
      deprecated: true
      servers:
        - url: https://cdn.petstore.io/v3
          description: CDN-backed read endpoint for pet details
      parameters:
        - name: petId
          in: path
          description: ID of pet to return
          required: true
          schema:
            type: integer
            format: int64
          examples:
            small_breed:
              summary: Small breed ID
              description: A common small-breed pet identifier
              value: 1
            large_breed:
              summary: Large breed ID
              description: A common large-breed pet identifier
              value: 42
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid ID supplied
        '404':
          description: Pet not found
    put:
      tags:
        - pet
      summary: Update an existing pet
      operationId: updatePet
      parameters:
        - name: petId
          in: path
          description: ID of pet to update
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Pet object that needs to be updated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid ID supplied
        '404':
          description: Pet not found
    delete:
      tags:
        - pet
      summary: Deletes a pet
      operationId: deletePet
      security:
        - adminBasic: []
        - machineAuth:
            - pets:write
      parameters:
        - name: petId
          in: path
          description: Pet id to delete
          required: true
          schema:
            type: integer
            format: int64
        - name: api_key
          in: cookie
          description: Session cookie used for authentication
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Pet deleted
        '400':
          description: Invalid pet value

  # ─── Avatar ──────────────────────────────────────────────────────────────────
  # Case 1:  binary request,  direct specific MIME  (PUT image/jpeg or image/png)
  # Case 10: byte   request,  nested in JSON object  (PUT application/json with format:byte property)
  # Case 7:  binary response, direct specific MIME  (GET image/jpeg or image/png)

  /pet/{petId}/avatar:
    put:
      tags:
        - pet
      summary: Set the pet's profile photo
      description: >-
        Accepts either raw image bytes (image/jpeg or image/png) or a JSON
        envelope carrying a base64-encoded image for clients that prefer a
        JSON-only workflow.
      operationId: setPetAvatar
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          # Case 1 — binary request, direct specific MIME
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          # Case 10 — byte request, nested in JSON object
          application/json:
            schema:
              type: object
              required:
                - data
                - mimeType
              properties:
                data:
                  type: string
                  format: byte
                  description: Base64-encoded image data
                mimeType:
                  type: string
                  example: image/jpeg
      responses:
        '204':
          description: Avatar updated
        '404':
          description: Pet not found
    get:
      tags:
        - pet
      summary: Get the pet's profile photo
      description: Returns the raw image bytes of the pet's current avatar.
      operationId: getPetAvatar
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            # Case 7 — binary response, direct specific MIME
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Pet not found

  # ─── Avatar thumbnail ────────────────────────────────────────────────────────
  # Case 11: byte request,  top-level bare   (PUT — single base64 string or array)
  # Case 12: byte request,  array items      (PUT — array variant via oneOf)
  # Case 13: byte response, top-level bare   (GET — bare base64 string)

  /pet/{petId}/avatar/thumbnail:
    put:
      tags:
        - pet
      summary: Set the pet's avatar thumbnail as base64
      description: >-
        Accepts either a single base64-encoded thumbnail or an array of
        candidates; the server selects the most suitable one.
      operationId: setPetAvatarThumbnail
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                # Case 11 — byte request, top-level bare
                - type: string
                  format: byte
                  description: Single base64-encoded thumbnail
                # Case 12 — byte request, array items
                - type: array
                  items:
                    type: string
                    format: byte
                  description: Multiple base64-encoded candidates; server picks best
      responses:
        '204':
          description: Thumbnail updated
        '404':
          description: Pet not found
    get:
      tags:
        - pet
      summary: Get the pet's avatar thumbnail as base64
      description: >-
        Returns a compact base64-encoded thumbnail suitable for embedding
        directly in mobile UI without a separate image request.
      operationId: getPetAvatarThumbnail
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                # Case 13 — byte response, top-level bare
                type: string
                format: byte
                example: "dGVzdC1pbWFnZQ=="
        '404':
          description: Pet not found

  # ─── Photo gallery ───────────────────────────────────────────────────────────
  # Case 5: binary request, multipart file + JSON object part  (encoding block)
  # Case 6: binary request, multipart array of files
  # Case 9: binary response, content negotiation (image/* vs application/json)

  /pet/{petId}/photos:
    post:
      tags:
        - pet
      summary: Add photos to the pet's gallery
      description: >-
        Uploads one or more photos with structured metadata. The metadata
        part is serialised as JSON within the multipart body.
      operationId: addPetPhotos
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
                - metadata
              properties:
                # Case 6 — binary request, multipart array of files
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                # Case 5 — binary request, multipart file + JSON object part
                metadata:
                  $ref: '#/components/schemas/PhotoMetadata'
            encoding:
              metadata:
                contentType: application/json
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Photo'
        '404':
          description: Pet not found

  /pet/{petId}/photos/{photoId}:
    get:
      tags:
        - pet
      summary: Get a photo or its metadata
      description: >-
        Returns the raw image bytes or JSON metadata depending on the
        Accept header sent by the client.
      operationId: getPetPhoto
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: photoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            # Case 9 — binary response, content negotiation
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
        '404':
          description: Photo not found

  # ─── Adoption certificate ────────────────────────────────────────────────────
  # Case 3: binary request, multipart single file, no companions

  /pet/{petId}/certificate:
    post:
      tags:
        - pet
      summary: Upload the pet's adoption certificate
      description: >-
        Attaches a single adoption certificate document. No metadata fields
        are required alongside the file.
      operationId: uploadPetCertificate
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                # Case 3 — binary request, multipart single file, no companions
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Pet not found

  # ─── Form-encoded preferences ────────────────────────────────────────────────
  # Case 10: application/x-www-form-urlencoded body with a required scalar, an
  # ARRAY field (exercises repeated-key array serialization parity) and an
  # OPTIONAL field (exercises null-field omission parity) across all SDKs.

  /pet/{petId}/preferences:
    post:
      tags:
        - pet
      summary: Update a pet's notification preferences
      description: >-
        Submits preferences as an application/x-www-form-urlencoded form. Used to
        exercise array-field (repeated-key) serialization and optional-field
        omission so the wire bytes are identical across every SDK.
      operationId: setPetPreferences
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - nickname
              properties:
                nickname:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                note:
                  type: string
                # Case 14 — format:date (date-only) form field. Must serialize
                # as YYYY-MM-DD, never a date-time.
                renewalDate:
                  type: string
                  format: date
                # date-time form field. Must serialize with the canonical
                # stringify form (2024-01-15T10:30:00.000+00:00), percent-encoded.
                # (Deliberately not named after a camelCase instant: a single
                # word keeps the fixture vocabulary check quiet.)
                reminder:
                  type: string
                  format: date-time
                # Typed scalar form fields: integer, number, boolean and duration
                # must each serialize in their canonical wire text.
                intervalDays:
                  type: integer
                  format: int32
                ratio:
                  type: number
                  format: double
                urgent:
                  type: boolean
                snooze:
                  type: string
                  format: duration
                # D164: the Encoding Object below sets allowReserved, so the
                # reserved characters of this field are sent literally.
                route:
                  type: string
            encoding:
              route:
                allowReserved: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Pet not found

  /pet/{petId}/attachments:
    post:
      tags:
        - pet
      summary: Attach files in a multipart/mixed request
      description: Declares multipart/mixed so a declared multipart subtype other than form-data must reach the transport.
      operationId: attachPetFiles
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/mixed:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                caption:
                  type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ─── Vet documents ───────────────────────────────────────────────────────────
  # Case 2: binary request,  octet-stream  (POST application/octet-stream)
  # Case 4: binary request,  multipart file + scalar companions
  # Case 8: binary response, octet-stream  (GET application/octet-stream)

  /pet/{petId}/documents:
    post:
      tags:
        - pet
      summary: Attach a vet document or health record
      description: >-
        Accepts either a multipart upload with document classification fields,
        or a raw octet-stream for server-to-server and CLI clients that prefer
        to stream bytes directly.
      operationId: uploadPetDocument
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          # Case 4 — binary request, multipart file + scalar companions
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                documentType:
                  type: string
                  enum:
                    - health_certificate
                    - vaccination_record
                    - microchip_record
                notes:
                  type: string
                # Typed scalar parts: each must be a plain text part (no part
                # Content-Type) carrying the canonical stringify form.
                isPrimary:
                  type: boolean
                pageCount:
                  type: integer
                  format: int64
                takenAt:
                  type: string
                  format: date-time
                swatch:
                  $ref: '#/components/schemas/Swatch'
          # Case 2 — binary request, direct octet-stream
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Pet not found

  /pet/{petId}/documents/{documentId}:
    get:
      tags:
        - pet
      summary: Download a vet document
      description: >-
        Returns the raw document bytes as an octet-stream. The original MIME
        type is communicated via the Content-Type response header.
      operationId: downloadPetDocument
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: documentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            # Case 8 — binary response, octet-stream
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Document not found

  # ─── Pet summary ─────────────────────────────────────────────────────────────
  # Non-JSON success body on a NON-binary return: a text/plain String return.

  # Also carries a required cookie, a date path segment in matrix style, a
  # query array of dates, and hostile prose in the summary, description and a
  # parameter description (code literals and doc comments must survive it).
  /pet/{petId}/summary/{asOf}:
    get:
      tags:
        - pet
      summary: "Get a <plain> \"text\" summary & it's short"
      description: "Returns '''plain''' text for /pets/#{id} and <b> & \"c\" it's done"
      operationId: getPetSummary
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: asOf
          in: path
          required: true
          description: Summary date, sent as a matrix-style path segment
          style: matrix
          schema:
            type: string
            format: date
        - name: session
          in: cookie
          required: true
          description: "Session token: \"a<b>\" & it's required"
          schema:
            type: string
        - name: days
          in: query
          required: false
          description: Extra dates to summarise
          schema:
            type: array
            items:
              type: string
              format: date
      responses:
        '200':
          description: Successful operation
          content:
            text/plain:
              schema:
                type: string
              example: hello
        '404':
          description: Pet not found

  # ─── Pet passport ─────────────────────────────────────────────────────────────
  # Case 14: byte response, nested in JSON object   (thumbnail property)
  # Case 15: byte response, array items             (scans array)

  /pet/{petId}/passport:
    get:
      tags:
        - pet
      summary: Get the pet's passport
      description: >-
        Returns a single JSON document combining the pet's profile with an
        embedded base64 thumbnail and base64-encoded scans of each passport
        page, suitable for mobile clients that prefer a single-request workflow.
      operationId: getPetPassport
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetPassport'
        '404':
          description: Pet not found

  # ─── Pet treatment ──────────────────────────────────────────────────────────

  /pet/{petId}/treatment:
    post:
      tags:
        - pet
      summary: Record a treatment for a pet
      operationId: addPetTreatment
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetTreatment'
      responses:
        '200':
          description: Treatment recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetTreatment'
      security:
        - petstore_auth:
            - write:pets

  # ─── Styled parameters ─────────────────────────────────────────────────────

  /pet/{petId}/tag/{tagName}:
    get:
      tags:
        - pet
      summary: Get a tag for a pet
      operationId: getPetTag
      parameters:
        - name: petId
          in: path
          required: true
          style: matrix
          explode: false
          schema:
            type: integer
            format: int64
        - name: tagName
          in: path
          required: true
          style: label
          schema:
            type: string
        - name: colors
          in: query
          style: pipeDelimited
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: sizes
          in: query
          style: spaceDelimited
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: filter
          in: query
          allowEmptyValue: true
          schema:
            type: string
        - name: revision
          in: query
          allowReserved: true
          description: >-
            Query value whose RFC 3986 reserved characters must be sent
            literally (OAS allowReserved), for example a version expression
            such as v1.0/beta:rc1 keeping the slash and colon.
          schema:
            type: string
        # Object-valued (model) parameters: converted to a wire-keyed map via
        # the SDK serializer, then expanded per style/explode.
        - name: criteria
          in: query
          description: Object-valued query parameter, form style exploded (the OAS default for query)
          schema:
            $ref: '#/components/schemas/PetCriteria'
        - name: criteriaCsv
          in: query
          style: form
          explode: false
          schema:
            $ref: '#/components/schemas/PetCriteria'
        - name: criteriaDeep
          in: query
          style: deepObject
          explode: true
          schema:
            $ref: '#/components/schemas/PetCriteria'
        - name: X-Criteria
          in: header
          style: simple
          explode: false
          schema:
            $ref: '#/components/schemas/PetCriteria'
        # format: byte parameters: base64 (standard alphabet) on the wire.
        - name: fingerprint
          in: query
          description: Opaque bytes, base64 on the wire (OAS format byte)
          schema:
            type: string
            format: byte
        - name: X-Fingerprint
          in: header
          schema:
            type: string
            format: byte
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

  /pet/byName/{name}:
    get:
      tags:
        - pet
      summary: Look up a pet by name (simple string path param + required query)
      operationId: getPetByName
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: category
          in: query
          required: true
          schema:
            type: string
        # Required HEADER whose name differs from its caller-facing identifier
        # (xCorrelationId / x_correlation_id ...): the missing-parameter message
        # names the identifier. Not X-Request-Id, which the transport injects.
        - name: X-Correlation-Id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

  /pet/byNote:
    get:
      tags:
        - pet
      summary: Look up a pet by note (required query parameters whose value may be null)
      operationId: getPetByNote
      parameters:
        - name: note
          in: query
          required: true
          schema:
            type:
              - string
              - "null"
        - name: rank
          in: query
          required: true
          schema:
            type:
              - integer
              - "null"
        - name: Accept
          in: header
          schema:
            type: string
        - name: content-type
          in: header
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

  # ─── Per-operation servers ────────────────────────────────────────────────

  # ─── Paged lists (design: docs/design/pagination.md) ─────────────────────────

  /pet/catalog:
    get:
      tags:
        - pet
      summary: Lists the pet catalog one page at a time with a next-cursor token
      operationId: listPetCatalog
      security:
        - petStoreBearer: []
      parameters:
        - name: limit
          in: query
          description: The number of pets on a page
          required: false
          schema:
            type: integer
            format: int32
        - name: cursor
          in: query
          description: Where to continue, as returned in next_cursor of the previous page
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One page of pets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetCatalogPage'

  /pet/feed:
    get:
      tags:
        - pet
      summary: Lists the pet feed one page at a time with a Link header
      operationId: listPetFeed
      security:
        - petStoreBearer: []
      parameters:
        - name: limit
          in: query
          description: The number of pets on a page
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: One page of pets, with the next page in the Link header
          headers:
            Link:
              description: The next page as rel="next", when there is one
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'

  /pet/matches:
    get:
      tags:
        - pet
      summary: Finds pets and their owners; two lists make it ambiguous, so it is not paged
      operationId: listPetMatches
      security:
        - petStoreBearer: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Pets and owners of one page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetMatchPage'

  /pet/notes:
    get:
      tags:
        - pet
      summary: Lists pet notes; the names are not a known cursor, a vendor hint says it is paged
      operationId: listPetNotes
      security:
        - petStoreBearer: []
      x-fern-pagination:
        cursor: $request.pos
        next_cursor: $response.following
        results: $response.rows
      parameters:
        - name: pos
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One page of notes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetNotePage'

  /pet/events:
    get:
      tags:
        - pet
      summary: Lists pet events; only the generator option says it is paged
      operationId: listPetEvents
      security:
        - petStoreBearer: []
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One page of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetEventPage'

  /pet/archive:
    get:
      tags:
        - pet
      summary: Lists archived pets; it looks paged, and the generator option says it is not
      operationId: listPetArchive
      security:
        - petStoreBearer: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One page of archived pets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetArchivePage'

  /pet/offsets:
    get:
      tags:
        - pet
      summary: Lists pets by offset and limit; the list ends on an empty page
      operationId: listPetOffsets
      security:
        - petStoreBearer: []
      parameters:
        - name: offset
          in: query
          description: The offset of the first pet on the page
          required: false
          schema:
            type: integer
            format: int32
        - name: limit
          in: query
          description: The number of pets on a page
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: One page of pets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetOffsetPage'

  /pet/pages:
    get:
      tags:
        - pet
      summary: Lists pets one numbered page at a time; the list ends on an empty page
      operationId: listPetPageNumbers
      security:
        - petStoreBearer: []
      parameters:
        - name: page
          in: query
          description: The number of the page, from 1
          required: false
          schema:
            type: integer
            format: int32
        - name: per_page
          in: query
          description: The number of pets on a page
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: One numbered page of pets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetPageNumberPage'

  /pet/after:
    get:
      tags:
        - pet
      summary: Lists pets after the id of the last one; the has_more flag says when the list ends
      operationId: listPetsAfter
      security:
        - petStoreBearer: []
      parameters:
        - name: starting_after
          in: query
          description: The id of the last pet of the previous page
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: The number of pets on a page
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: One page of pets with the id of its last pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetAfterPage'

  /pet/next:
    get:
      tags:
        - pet
      summary: Lists pets with the URL of the next page in the body
      operationId: listPetNextUrl
      security:
        - petStoreBearer: []
      parameters:
        - name: limit
          in: query
          description: The number of pets on a page
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: One page of pets with the URL of the next page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetNextUrlPage'

  /pet/{petId}/external:
    get:
      servers:
        - url: https://external-api.example.com/v1
      tags:
        - pet
      summary: Get external pet info
      operationId: getExternalPetInfo
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

  /pet/{petId}/staging:
    get:
      servers:
        - url: https://{environment}.example.com/api/{version}
          description: Staging server
          variables:
            environment:
              default: staging
              description: Deployment environment
              enum:
                - staging
                - sandbox
            version:
              default: v3
              description: API version
              enum:
                - v2
                - v3
      tags:
        - pet
      summary: Get staging pet info
      operationId: getStagingPetInfo
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

  /pet/{petId}/multi:
    get:
      servers:
        - url: https://primary.example.com/v1
          description: Primary
        - url: https://{region}.example.com/v1
          description: Regional
          variables:
            region:
              default: us
              description: Geographic region
              enum:
                - us
                - eu
                - ap
        # Third variant: reuses the variable name `region` with a DIFFERENT
        # enum (one type per variable per operation) and adds a second
        # variable whose values need escaping in a string literal.
        - url: https://{region}.mirror.example.com/{channel}/v1
          description: Mirror
          variables:
            region:
              default: us
              description: Mirror region
              enum:
                - us
                - eu
            channel:
              default: "a&b"
              description: Release channel
              enum:
                - "a&b"
                - "it's"
      tags:
        - pet
      summary: Get multi-server pet info
      operationId: getMultiServerPetInfo
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

  # ─── Store ───────────────────────────────────────────────────────────────────

  /store/inventory:
    get:
      tags:
        - store
      summary: Returns pet inventories by status
      operationId: getInventory
      security: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32

  /store/tree:
    get:
      tags:
        - store
      summary: Returns a self-referential tree (recursive-type codegen fixture)
      operationId: getTree
      security: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreeNode'

  /store/by-swatch/{pathSwatch}:
    get:
      tags:
        - store
      summary: Echoes a swatch supplied via path, query and header parameters.
      operationId: getBySwatch
      security: []
      parameters:
        # Required named-enum ($ref) param: a path param is a required method
        # argument on the API class (not an Options member). Its enum type must
        # be referenced/imported correctly there in every SDK.
        - name: pathSwatch
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Swatch'
        # Optional named-enum ($ref) parameters: these land in the generated
        # Options class, which must import/qualify the enum type (its generated
        # type lives in the models namespace) across every SDK.
        - name: querySwatch
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Swatch'
        - name: Preferred-Swatch
          in: header
          required: false
          schema:
            $ref: '#/components/schemas/Swatch'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'

  /store/swatch:
    get:
      tags:
        - store
      summary: Returns a bare enum (value-type response codegen fixture).
      operationId: getSwatch
      security: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Swatch'

  /store/department:
    get:
      tags:
        - store
      summary: Returns a department (mutual-recursion codegen fixture).
      operationId: getDepartment
      security: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'

  /store/defaults:
    get:
      tags:
        - store
      summary: Returns a model exercising schema defaults on deserialize.
      operationId: getDefaults
      security: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Defaults'

  /store/grouped-categories:
    get:
      tags:
        - store
      summary: Returns categories grouped into an array of string-keyed maps.
      operationId: getGroupedCategories
      security: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/Category'

  /store/matrix:
    get:
      tags:
        - store
      summary: Returns a matrix as an array of integer arrays.
      operationId: getMatrix
      security: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items:
                    type: integer
                    format: int32

  /store/stock-item:
    get:
      tags:
        - store
      summary: Returns a stock item exercising int-enum, non-lowercase enum and nested-container fields.
      operationId: getStockItem
      security: []
      parameters:
        # Optional date-time OPERATION query param. Exercises finding 2.10:
        # Go's options/api paths emit time.Time without importing "time" when a
        # date-time appears as an operation parameter (the model path imports it
        # correctly, but the operation path was masked because petstore only
        # used date-time in model bodies).
        - name: asOf
          in: query
          required: false
          description: Only consider stock as of this instant
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockItem'

  /store/swatch-groups:
    get:
      tags:
        - store
      summary: Returns swatches grouped as an array of string-keyed enum maps.
      operationId: getSwatchGroups
      security: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties:
                    $ref: '#/components/schemas/Swatch'

  /store/timestamp-groups:
    get:
      tags:
        - store
      summary: Returns timestamps grouped as an array of string-keyed maps.
      operationId: getTimestampGroups
      security: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties:
                    type: string
                    format: date-time

  /store/order:
    post:
      tags:
        - store
      summary: Place an order for a pet
      operationId: placeOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid Order

  /store/audit:
    get:
      tags:
        - store
      summary: Read the audit trail, which needs a bearer token and an API key together
      description: One security requirement that names two schemes, so a request carries both credentials.
      operationId: getAuditTrail
      security:
        - petStoreBearer: []
          apiKeyHeader: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /store/reservation:
    post:
      tags:
        - store
      summary: Reserve stock, answering with the existing or a new reservation
      description: Answers 200 with the existing Reservation, or 201 with a ReservationReceipt for a newly created one; the two success bodies have different schemas.
      operationId: reserveStock
      security: []
      responses:
        '200':
          description: An existing reservation was returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '201':
          description: A new reservation was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationReceipt'
        '400':
          description: Invalid reservation

  /store/order/{orderId}:
    get:
      tags:
        - store
      summary: Find purchase order by ID
      operationId: getOrderById
      parameters:
        - name: orderId
          in: path
          description: ID of order to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid ID supplied
        '404':
          description: Order not found
    delete:
      tags:
        - store
      summary: Delete purchase order by ID
      operationId: deleteOrder
      parameters:
        - name: orderId
          in: path
          description: ID of the order to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Order deleted
        '400':
          description: Invalid ID supplied
        '404':
          description: Order not found

  # uuid path parameter and uuid model property (lowercase hyphenated, validated).
  /store/order/by-tracking/{trackingId}:
    get:
      tags:
        - store
      summary: Find purchase order by tracking id
      operationId: getOrderByTrackingId
      security: []
      parameters:
        - name: trackingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  # readOnly / writeOnly model properties: no wire effect in any SDK.
  /store/account:
    post:
      tags:
        - store
      summary: Create an account
      operationId: createAccount
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Account'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'

  # Content-encoded (content: instead of schema:) query and header parameters,
  # a uniqueItems (Set) array parameter and a format: time parameter.
  /store/search:
    get:
      tags:
        - store
      summary: Searches the store; exercises content-encoded, Set and time-of-day parameters.
      operationId: searchStore
      security: []
      parameters:
        - name: q
          in: query
          description: JSON-encoded query parameter (OAS `content`, not `schema`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoMetadata'
        - name: X-Filter
          in: header
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        - name: labels
          in: query
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
        - name: at
          in: query
          schema:
            type: string
            format: time
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  # Native-type formats: duration, ipv4, ipv6, uri, decimal (number and string
  # shaped), date, hostname and email as body fields and as parameters.
  /store/native-values:
    get:
      tags:
        - store
      summary: Reads values of the formats the SDKs type natively.
      operationId: getNativeValues
      security: []
      parameters:
        - name: address4
          in: query
          schema:
            type: string
            format: ipv4
        - name: delay
          in: query
          schema:
            type: string
            format: duration
        - name: X-Address6
          in: header
          schema:
            type: string
            format: ipv6
        - name: amount
          in: query
          schema:
            type: number
            format: decimal
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeValues'

  # ─── Memos: path-item servers, every HTTP method, reusable components ─────────
  # Servers declared on a path item apply to every operation under it that
  # declares none of its own (#62). The parameter, response and request body
  # come from components by $ref (#56).
  /store/memos/{memoId}:
    servers:
      - url: https://memos.example.com/v1
        description: Memos
    parameters:
      - $ref: '#/components/parameters/MemoId'
    get:
      tags: [store]
      summary: Reads a memo from the server its path declares
      operationId: getMemo
      security: []
      responses:
        '200':
          $ref: '#/components/responses/MemoFound'

  # The path item is a $ref to components.pathItems (#56) and carries the
  # PATCH, HEAD, OPTIONS and TRACE operations (#59).
  /store/memos/{memoId}/revisions:
    $ref: '#/components/pathItems/MemoRevisions'

  # ─── Transport-test endpoints ─────────────────────────────────────────────
  # Served by chasm; filtered out of SDK generation by DropInternalOperationsRule
  # (each operation carries x-internal: true). Echo, delay, compression,
  # redirects, error statuses, multi-value headers, text/empty bodies.
  # Declared error responses: two operations that each declare a 404 with a
  # DIFFERENT schema, one status range per range operation, a default response,
  # and one schema declared under two statuses.
  /projects/{projectId}:
    get:
      tags: [problems]
      summary: Read a project, declaring a 404 with its own schema
      operationId: getProject
      security: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The project was found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '404':
          description: The project does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectNotFound'

  /members/{memberId}:
    get:
      tags: [problems]
      summary: Read a member, declaring a 404 with a different schema
      operationId: getMember
      security: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The member was found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '404':
          description: The member does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberNotFound'

  /ranges/{rangeId}:
    get:
      tags: [problems]
      summary: Read a range, declaring one schema for every 4XX status
      operationId: getRange
      security: []
      parameters:
        - name: rangeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The range was found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '4XX':
          description: The request was rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RejectedRequest'

  /upstreams/{upstreamId}:
    get:
      tags: [problems]
      summary: Read an upstream, declaring one schema for every 5XX status
      operationId: getUpstream
      security: []
      parameters:
        - name: upstreamId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The upstream answered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '5XX':
          description: The upstream failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamFailure'

  /fallbacks/{fallbackId}:
    get:
      tags: [problems]
      summary: Read a fallback, declaring a default response
      operationId: getFallback
      security: []
      parameters:
        - name: fallbackId
          in: path
          required: true
          schema:
