security:
  - petStoreBasic: []
  - petStoreBearer: []

components:
  securitySchemes:
    petStoreBasic:
      type: http
      scheme: basic
    adminBasic:
      type: http
      scheme: basic
    petStoreBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceToken:
      type: http
      scheme: bearer
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    internalApiKey:
      type: apiKey
      in: header
      name: X-Internal-Key
    apiKeyQuery:
      type: apiKey
      in: query
      name: api_key
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION_ID
    machineAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.com/oauth/token
          scopes:
            pets:read: Read pets
            pets:write: Write pets
    legacyAuth:
      type: oauth2
      flows:
        password:
          tokenUrl: https://auth.example.com/oauth/token
          refreshUrl: https://auth.example.com/oauth/refresh
          scopes:
            read: Read access
    userAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.com/authorize
          tokenUrl: https://auth.example.com/oauth/token
          refreshUrl: https://auth.example.com/oauth/refresh
          scopes:
            pets:read: Read pets
            pets:write: Write pets
    browserAuth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://auth.example.com/authorize
          scopes:
            read: Read access
    ssoAuth:
      type: openIdConnect
      openIdConnectUrl: https://auth.example.com/.well-known/openid-configuration

  schemas:

    Reservation:
      type: object
      required: [reservationId, quantity]
      properties:
        reservationId:
          type: integer
          format: int64
          example: 31
        quantity:
          type: integer
          format: int32
          example: 4

    ReservationReceipt:
      type: object
      required: [receiptCode, expiresAt]
      properties:
        receiptCode:
          type: string
          example: rcpt-77
        expiresAt:
          type: string
          format: date-time
          example: '2030-01-01T00:00:00Z'

    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        petId:
          type: integer
          format: int64
          example: 198772
        quantity:
          type: integer
          format: int32
          example: 7
          minimum: 1
          maximum: 100
        trackingId:
          type: string
          format: uuid
        shipDate:
          type: string
          format: date-time
        status:
          type: string
          description: Order Status
          example: approved
          default: placed
          enum:
            - placed
            - approved
            - delivered
        complete:
          type: boolean

    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Dogs
          x-examples:
            small_breed:
              summary: Small breed
              description: Toy or small breed dogs
              value: Chihuahua
            large_breed:
              summary: Large breed
              description: Working or guard breed dogs
              value: GreatDane

    Tag:
      type: object
      deprecated: true
      description: Tags are deprecated, use categories instead
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    Pet:
      required:
        - name
        - photoUrls
      type: object
      externalDocs:
        description: Learn more about the Pet model
        url: https://example.com/docs/pet
      properties:
        id:
          type: integer
          format: int64
          example: 10
        name:
          type: string
          example: doggie
        category:
          $ref: '#/components/schemas/Category'
        photoUrls:
          type: array
          uniqueItems: true
          items:
            type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        status:
          type: string
          description: pet status in the store
          deprecated: true
          enum:
            - available
            - pending
            - sold
        location:
          $ref: '#/components/schemas/GeoPoint'
        # Type-surface exercise fields — each one drives a generator
        # mapping that varies by language (branded URI in Node, HttpUrl in
        # Python, System.Uri in C#, io.ktor.http.Url in Kotlin, etc.).
        homepageUrl:
          type: string
          format: uri
          description: Absolute URL to the pet's public profile page
          example: https://example.com/pets/fido
        # uri-reference may be relative; languages MUST keep this as a
        # plain string surface even though `format: uri` is typed.
        thumbnailRef:
          type: string
          format: uri-reference
          description: Optionally-relative thumbnail location
          example: /assets/thumb-fido.png
        # uri-template (RFC 6570) contains {var} placeholders so no real
        # URI parser will accept it — stays a plain string surface.
        linkTemplate:
          type: string
          format: uri-template
          description: RFC 6570 template for related-resource links
          example: https://example.com/pets/{id}/photos{?size}
        ownerEmail:
          type: string
          format: email
          description: Contact email for the pet's owner
          example: owner@example.com
        # Plain `type: number` without a numeric format — decimal-precision
        # surface. Becomes branded `Decimal` in Node, BigDecimal in
        # Java/Kotlin, decimal.Decimal in Python, etc.
        weightKg:
          type: number
          description: Pet weight in kilograms (decimal precision)
          example: 12.345
        # Validation keywords no SDK enforces: a value outside these bounds must
        # still decode and round-trip. The look-around pattern is not portable
        # across regex engines, so it must also not break model import.
        nickname:
          type: string
          example: rex
          minLength: 2
          maxLength: 8
          pattern: "^(?!admin)[a-z']+$"

    PetCatalogPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        next_cursor:
          type: string
          description: The cursor of the next page, absent on the last page
    PetOffsetPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        has_more:
          type: boolean
          description: Whether a further page follows
    PetPageNumberPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        has_more:
          type: boolean
          description: Whether a further page follows
    PetAfterPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        has_more:
          type: boolean
          description: Whether a further page follows
        last_id:
          type: string
          description: The id of the last pet on this page
    PetNextUrlPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        next_url:
          type: string
          format: uri
          description: The URL of the next page, absent on the last page
    PetMatchPage:
      type: object
      properties:
        pets:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        owners:
          type: array
          items:
            type: string
        next_cursor:
          type: string
    PetNotePage:
      type: object
      properties:
        rows:
          type: array
          items:
            type: string
        following:
          type: string
    PetEventPage:
      type: object
      properties:
        events:
          type: array
          items:
            type: string
        upto:
          type: string
    PetArchivePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        next_cursor:
          type: string
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        type:
          type: string
        message:
          type: string

    DryFood:
      type: object
      required:
        - foodType
        - weightKg
      properties:
        foodType:
          type: string
        weightKg:
          type: number
          format: double

    WetFood:
      type: object
      required:
        - foodType
        - volumeMl
      properties:
        foodType:
          type: string
        volumeMl:
          type: integer
          format: int32

    PetFood:
      description: Food for pets, discriminated by foodType
      oneOf:
        - $ref: '#/components/schemas/DryFood'
        - $ref: '#/components/schemas/WetFood'
      discriminator:
        propertyName: foodType
        mapping:
          dry: '#/components/schemas/DryFood'
          wet: '#/components/schemas/WetFood'

    Medication:
      type: object
      required:
        - drugName
      properties:
        drugName:
          type: string
        dosage:
          type: string
        notes:
          type: string

    Surgery:
      type: object
      required:
        - procedureName
      properties:
        procedureName:
          type: string
        durationMinutes:
          type: integer
          format: int32
        notes:
          type: string

    PetTreatment:
      description: A treatment that can match a medication, a surgery, or both
      anyOf:
        - $ref: '#/components/schemas/Medication'
        - $ref: '#/components/schemas/Surgery'

    # Same members as PetTreatment in the opposite, non-alphabetical order:
    # variants are tried in DECLARATION order, so Surgery is tried first.
    TreatmentRecord:
      description: Same members as PetTreatment declared in non-alphabetical order
      anyOf:
        - $ref: '#/components/schemas/Surgery'
        - $ref: '#/components/schemas/Medication'

    PetWithOwner:
      description: A pet record extended with owner information
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          required:
            - ownerName
          properties:
            ownerName:
              type: string
            ownerEmail:
              type: string
              format: email

    # Classic allOf inheritance: a base schema with a discriminator and children that
    # compose it. Vehicle uses an explicit mapping, Shape the implicit schema-name one.
    Vehicle:
      type: object
      required:
        - vehicleType
        - plate
      properties:
        vehicleType:
          type: string
        plate:
          type: string
      discriminator:
        propertyName: vehicleType
        mapping:
          car: '#/components/schemas/Car'
          truck: '#/components/schemas/Truck'

    Car:
      allOf:
        - $ref: '#/components/schemas/Vehicle'
        - type: object
          required:
            - doorCount
          properties:
            doorCount:
              type: integer
              format: int32

    Truck:
      allOf:
        - $ref: '#/components/schemas/Vehicle'
        - type: object
          properties:
            payloadKg:
              type: integer
              format: int32

    Shape:
      type: object
      required:
        - shapeType
      properties:
        shapeType:
          type: string
        label:
          type: string
      discriminator:
        propertyName: shapeType

    Circle:
      allOf:
        - $ref: '#/components/schemas/Shape'
        - type: object
          required:
            - radius
          properties:
            radius:
              type: number
              format: double

    Square:
      allOf:
        - $ref: '#/components/schemas/Shape'
        - type: object
          required:
            - side
          properties:
            side:
              type: number
              format: double

    Photo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        caption:
          type: string
        isPrimary:
          type: boolean
        url:
          type: string

    PhotoMetadata:
      type: object
      properties:
        caption:
          type: string
        isPrimary:
          type: boolean
        takenAt:
          type: string
          format: date-time
        location:
          $ref: '#/components/schemas/PhotoMetadataLocation'

    PhotoMetadataLocation:
      type: object
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double

    # Object-valued parameter schema. `min_age` is deliberately snake_case so a
    # test asserts WIRE names, and breed < min_age keeps declaration order equal
    # to alphabetical order.
    PetCriteria:
      type: object
      properties:
        breed:
          type: string
        min_age:
          type: integer
          format: int32

    PetPassport:
      type: object
      properties:
        pet:
          $ref: '#/components/schemas/Pet'
        # Case 14 — byte response, nested in JSON object
        thumbnail:
          type: string
          format: byte
          description: Base64-encoded primary thumbnail
          example: "dGVzdC10aHVtYm5haWw="
        # Case 15 — byte response, array items
        scans:
          type: array
          items:
            type: string
            format: byte
            example: "dGVzdC1zY2Fu"
          description: Base64-encoded scans of each passport page
        issuedAt:
          type: string
          format: date-time
        # Gap BB — OAS 3.1 contentEncoding/contentMediaType.
        # Normalized by the CONTENT_ENCODING rule into format: byte +
        # contentMediaType appended to the docstring. Without the rule,
        # generators that only understand OAS 3.0 would emit a plain
        # String here with no base64 decoding.
        biometricChip:
          type: string
          contentEncoding: base64
          contentMediaType: application/octet-stream
          description: Embedded chip data (OAS 3.1 contentEncoding form)

    Metadata:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
      additionalProperties:
        type: string

    # Typed additionalProperties (issue 103): one model per value kind, so each
    # promise has a schema. None is referenced by an operation.
    Counters:
      type: object
      properties:
        label:
          type: string
      additionalProperties:
        type: integer
        format: int32

    Ledger:
      type: object
      required:
        - entryId
      properties:
        entryId:
          type: integer
        entryIds:
          type: array
          items:
            type: integer

    Roster:
      type: object
      properties:
        label:
          type: string
      additionalProperties:
        $ref: '#/components/schemas/Category'

    Moments:
      type: object
      properties:
        label:
          type: string
      additionalProperties:
        type: string
        format: date-time

    Blobs:
      type: object
      properties:
        label:
          type: string
      additionalProperties:
        type: string
        format: byte

    Sparse:
      type: object
      properties:
        label:
          type: string
      additionalProperties:
        type:
          - string
          - "null"

    Freeform:
      type: object
      properties:
        label:
          type: string
      additionalProperties: true

    # Gap BE — byte-array equality shapes. A model's generated equality must
    # compare byte arrays by CONTENT, never by reference, and must distinguish a
    # LIST of byte arrays from a MAP of them: deep-array comparison takes a
    # collection, so applying it to a map is a compile error in some languages.
    # petstore previously had a bare byte[] and an array-of-byte REQUEST body but
    # no model carrying these as properties, and no map-of-bytes at all, so the
    # map branch was never rendered. Exercised by the generated-client equality
    # test in each language.
    BinaryVault:
      type: object
      properties:
        seal:
          description: A bare byte array; equality compares its contents.
          type: string
          format: byte
        shards:
          description: A list of byte arrays; equality compares element contents.
          type: array
          items:
            type: string
            format: byte
        labels:
          description: A map of byte arrays; equality compares each value's contents.
          type: object
          additionalProperties:
            type: string
            format: byte

    # Gap AX.1 — OAS 3.1 / JSON Schema 2020-12 strict-mode. Deserializers must
    # reject any JSON key not declared here (or inherited via allOf). Used by the
    # generated-client extra-key-rejection test in each language.
    StrictTag:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      unevaluatedProperties: false

    # Gap AZ — OAS 3.1 / JSON Schema 2020-12 `prefixItems` (positional tuple
    # arrays). Normalized by NormalizePrefixItemsRule into a plain
    # `type: array, items: {}` (Object / Any / interface{}) with the original
    # per-index types preserved in the schema description. Heterogeneous
    # fixed-arity tuples have no portable representation across the 12 target
    # languages, so we degrade to a homogeneous array; callers must downcast
    # per index following the docstring.
    GeoPoint:
      type: array
      prefixItems:
        - type: number
          format: double
        - type: number
          format: double
        - type: string

    # Standalone string-enum component (NOT an inline property enum like
    # Order.status). Exercises the top-level enum template path: in Java that
    # path emits @JsonValue / @JsonCreator and must self-import the Jackson
    # annotations, which only the inline-enum and object-model paths did before.
    Color:
      type: string
      description: A standalone, reusable colour enumeration
      enum:
        - red
        - green
        - blue

    # Collected real-world shapes that the petstore previously lacked, each of
    # which broke at least one generator against a real protobuf-derived spec.
    NativeValues:
      type: object
      properties:
        address4:
          type: string
          format: ipv4
          example: 192.0.2.1
        address6:
          type: string
          format: ipv6
          example: 2001:db8::1
        addresses:
          type: array
          items:
            type: string
            format: ipv6
        homepage:
          type: string
          format: uri
          example: https://example.com/a
        amount:
          type: number
          format: decimal
          example: 12.345678901234567890123
        ledger:
          type: string
          format: decimal
          example: '12.50'
        wait:
          type: string
          format: duration
          example: 3600s
        since:
          type: string
          format: date
          example: '2024-02-29'
        host:
          type: string
          format: hostname
          example: example.com
        contact:
          type: string
          format: email
          example: a@example.com

    EdgeCases:
      type: object
      description: >-
        Edge-case property shapes mirrored from real protobuf-derived specs.
      properties:
        # Bug 1 — nullable free-form (any-typed) property. Optional + no type
        # ⇒ "mixed" in PHP. The PHP template used to emit `public ?mixed`,
        # a fatal parse error (mixed already includes null). Must come out as
        # bare `mixed`. Legal-but-redundant nullable-any everywhere else.
        freeFormAny:
          description: Arbitrary JSON value; may be absent or null
        # Bug 2 — reference to the standalone enum component above.
        favoriteColor:
          $ref: '#/components/schemas/Color'
        # Bug 3 — description carrying HTML entities, exactly as buf emits
        # quoted/angled proto comment text. Must be decoded to its readable
        # form ("user.grant.write", <admin>, & , don't) in every language's
        # generated comments, and must never appear as a raw entity or as the
        # `\&quot;` that tripped Python's invalid-escape SyntaxWarning.
        permissionsNote:
          type: string
          description: >-
            Required permission is &quot;user.grant.write&quot; for
            &lt;admin&gt; &amp; owner roles (don&#39;t skip it)
        # Bug 4 — properties literally named after language keywords. Python
        # (pydantic v2) rejects a leading-underscore field, so `and`→`_and`
        # crashed at import; the fix mangles to a trailing underscore (`and_`)
        # with the wire name preserved via the field alias.
        and:
          type: boolean
        or:
          type: boolean
        not:
          type: boolean
        class:
          type: string
        return:
          type: string
        # Bug 5 — protobuf Duration ⇒ Python datetime.timedelta (module-
        # qualified), which needs `import datetime`, not `from datetime import
        # timedelta`. Paired with a date-time field.
        retryAfter:
          type: string
          format: duration
          description: Back-off interval before retrying (protobuf-JSON duration, e.g. "3600s")
        expiresAt:
          type: string
          format: date-time
          description: Absolute expiry instant
        # Digit-leading property: needs a deterministic legal identifier, while
        # the wire key stays `2fa`.
        '2fa':
          type: boolean
        separator:
          $ref: '#/components/schemas/Separator'
        # Language literals as property names. Keys are quoted: YAML 1.1 reads
        # bare null/true/false as non-strings.
        'null':
          type: string
        'true':
          type: boolean
        'false':
          type: boolean
        # Model names that collide with language or SDK types (Error, Result)
        # must be renamed (ModelError, ModelResult) in all twelve SDKs.
        lastError:
          $ref: '#/components/schemas/Error'
        outcome:
          $ref: '#/components/schemas/Result'
        # format: time (RFC 3339 partial-time) in a model body.
        cutoff:
          type: string
          format: time
        # Inline property enum whose wire values are not lowercase identifiers.
        phase:
          type: string
          enum:
            - In-Stock
            - on-hold
            - OUT_OF_STOCK
        # Pattern with a slash and a backslash class, no apostrophe: the regex
        # must reach the SDK undelimited and unescaped.
        slug:
          type: string
          pattern: "^\\d+/[a-z]+$"

    # Self-referential schema. Exercises recursive-type code generation: a
    # value type that contains itself has infinite size unless the recursive
    # member is heap-indirected (e.g. Rust requires Box around the optional
    # self-reference). Drives the recursion round-trip test in every SDK.
    TreeNode:
      type: object
      required:
        - value
      properties:
        value:
          type: string
        child:
          $ref: '#/components/schemas/TreeNode'

    # Mutual recursion (Department -> Employee -> Department): neither model is a
    # DIRECT self-reference, so a generator that only boxes direct self-refs
    # leaves these as fixed-size value types — infinite size (rust E0072, swift
    # infinite-size struct). The reference cycle must be broken by indirecting an
    # edge (rust Box, swift @Indirect). The back-references are optional so a
    # finite value can still be constructed.
    Department:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        lead:
          $ref: '#/components/schemas/Employee'
    Employee:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        department:
          $ref: '#/components/schemas/Department'

    # Exercises schema defaults on deserialize across SDKs.
    Defaults:
      type: object
      properties:
        # non-enum scalar default (must apply on absent, not only enums)
        retries:
          type: integer
          format: int32
          default: 3
        # enum default that is NOT the first variant (must use the declared
        # default, not the type's first/zero variant)
        mode:
          type: string
          enum:
            - low
            - medium
            - high
          default: medium
        # nullable field with a default: absent -> default, explicit null -> null.
        # OAS 3.1 spells nullability as a "null" member of the type array (the
        # 3.0 `nullable: true` keyword is ignored under 3.1); the normalizer
        # folds this back to nullable:true so isNullable is set downstream.
        label:
          type:
            - string
            - "null"
          default: untitled
        # String default hostile to every language's literal syntax: quotes,
        # backslash, tab, newline, interpolation sigils, comment terminator.
        greeting:
          type: string
          default: "it's \"quoted\" \\ back\tslash\nnext $USD #{x} a*/b"
        # $ref'd enum whose COMPONENT carries the default (Swatch: green).
        swatch:
          $ref: '#/components/schemas/Swatch'
        # Numeric defaults must render as exact, compiling literals of the
        # target type (float vs double, integral double, int64 beyond int32).
        ratio:
          type: number
          default: 1.5
        scale:
          type: number
          format: float
          default: 0.25
        weight:
          type: number
          format: double
          default: 2
        ceiling:
          type: integer
          format: int64
          default: 9000000000

    # Named string enum used as the leaf of a nested container (array<map<enum>>)
    # to exercise enum-leaf deep deserialization (must not be routed through the
    # model fromJson / plainToInstance path).
    Swatch:
      type: string
      enum:
        - red
        - green
        - blue
      default: green

    # Integer-backed enum component. Exercises the int-enum template path that
    # 7 SDKs hard-code as String-backed (latent finding 2.29): the backing field
    # and wire (de)serialization must be int, not String. Dart is the reference.
    Priority:
      type: integer
      format: int32
      description: Task priority, integer-backed enum
      enum:
        - 1
        - 2
        - 3

    # String enum whose values are NOT all lowercase. Exercises enum-name
    # sanitization (2.17/2.18): the "on-hold" value requires variant-name
    # sanitization (hyphen is not a legal identifier character) and the
    # non-lowercase "Available"/"Sold" values must round-trip with their wire
    # casing preserved. The last four values carry characters that are special
    # inside a string literal (quote, backslash, `$` and `#{` interpolation).
    Availability:
      type: string
      description: Stock availability, non-lowercase string enum
      enum:
        - Available
        - Sold
        - on-hold
        - "o'clock"
        - 'a\b'
        - '$eq'
        - '#{x}'

    # Model carrying the latent shapes the petstore previously masked: an
    # integer-backed enum field, a non-lowercase string enum field with a
    # non-lowercase default, and a nested-container property (array of array of
    # integer) whose leaf is a non-model primitive. The nested container as a
    # MODEL PROPERTY (not an operation return) exercises the recursive
    # per-element deserialization path that finding 2.22 found masked.
    StockItem:
      type: object
      required:
        - priority
      properties:
        priority:
          $ref: '#/components/schemas/Priority'
        availability:
          $ref: '#/components/schemas/Availability'
          default: on-hold
        matrix:
          type: array
          description: Quantity grid as an array of integer arrays
          items:
            type: array
            items:
              type: integer
              format: int32

    # Enums whose members are named and described by the author. Tier uses an
    # array of names and of descriptions (the last text holds comment
    # terminators and interpolation sigils), Rank an integer enum with an
    # array of names and an object of descriptions that skips one member, Stage
    # an object of names keyed by wire value (two names that collide after
    # casing) with a description array that has a null entry.
    Tier:
      type: string
      enum:
        - s
        - m
        - l
      x-enumNames:
        - Small
        - Medium
        - Large
      x-enumDescriptions:
        - The smallest tier.
        - The medium tier.
        - 'The largest tier. Ends with */ and #{x} and $x.'

    Rank:
      type: integer
      format: int32
      enum:
        - 1
        - 2
        - 3
      x-enum-varnames:
        - LOW
        - MEDIUM
        - HIGH
      x-enum-descriptions:
        "1": The lowest rank.
        "3": The highest rank.

    Stage:
      type: string
      enum:
        - paused
        - active
        - live
      x-enumnames:
        paused: on hold
        active: Active
        live: active
      x-enumdescriptions:
        - Waiting.
        -
        - Running.

    Subscription:
      type: object
      required:
        - rank
      properties:
        tier:
          $ref: '#/components/schemas/Tier'
          default: m
        rank:
          $ref: '#/components/schemas/Rank'
        stage:
          $ref: '#/components/schemas/Stage'
        interval:
          type: string
          enum:
            - month
            - year
          x-enum-varnames:
            - MONTHLY
            - YEARLY
          x-enumDescriptions:
            - Billed every month.
            - Billed every year.

    # readOnly / writeOnly have no wire effect in any SDK: a readOnly property
    # is still decoded from a response, a writeOnly one is still sent.
    Account:
      type: object
      externalDocs:
        description: "Account <docs> & \"notes\" it's here"
        url: https://example.com/docs/account
      required:
        - username
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        username:
          type: string
        # format: password is a plain string on the wire: the real value is sent.
        password:
          type: string
          format: password
          writeOnly: true

    # Required AND nullable: the key must be present, null is a legal value and
    # is written as null.
    RequiredNullable:
      type: object
      required:
        - note
      properties:
        note:
          type:
            - string
            - "null"

    # String enum whose values sanitise to an empty or colliding identifier.
    Separator:
      type: string
      description: String enum whose values sanitise to an empty or colliding identifier
      enum:
        - " "
        - "@@"
        - "a-b"
        - "a_b"

    # Model names that collide with language / SDK types (Error, Result) get the
    # Model prefix in all twelve SDKs.
    Error:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string

    Result:
      type: object
      properties:
        ok:
          type: boolean

    ProjectNotFound:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string

    MemberNotFound:
      type: object
      properties:
        code:
          type: integer
          format: int32
        detail:
          type: string

    RejectedRequest:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string

    UpstreamFailure:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string

    UnexpectedFailure:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string

    StateConflict:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string

    # A memo, reached through the reusable components below (#56).
    Memo:
      type: object
      required: [memoId]
      properties:
        memoId:
          type: string
        text:
          type: string

  # Reusable components of every kind (#56). The memo operations reference the
  # parameter, responses, request body, header, example and path item; the link
  # and the callback are declared but referenced by nothing, since Link Objects
  # and callbacks are out of scope (S11).
  parameters:
    MemoId:
      name: memoId
      in: path
      required: true
      description: The memo to address
      schema:
        type: string

  responses:
    MemoFound:
      description: The memo
      headers:
        X-Revision:
          $ref: '#/components/headers/Revision'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Memo'
          examples:
            memo:
              $ref: '#/components/examples/MemoExample'

  requestBodies:
    MemoPatch:
      description: The fields of the memo to change
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Memo'
          examples:
            memo:
              $ref: '#/components/examples/MemoExample'

  headers:
    Revision:
      description: The revision of the memo
      schema:
        type: integer
        format: int32

  examples:
    MemoExample:
      summary: A short memo
      value:
        memoId: m1
        text: Restock on Friday

  links:
    MemoRevisionsLink:
      operationId: headMemo
      parameters:
        memoId: '$response.body#/memoId'

  callbacks:
    MemoChanged:
      '{$request.body#/callbackUrl}':
        post:
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Memo'
          responses:
            '200':
              description: The callback was received

  pathItems:
    MemoRevisions:
      # The path item's own text (#58): every operation below has a summary
      # of its own and no description, so each one takes this description.
      description: Revisions of one memo, read and changed with the less common HTTP methods.
      parameters:
        # The description beside the reference overrides the component's (#81).
        - $ref: '#/components/parameters/MemoId'
          description: The memo whose revisions are read or changed
      patch:
        tags: [store]
        summary: Changes a memo with a PATCH request
        operationId: patchMemo
        security: []
        requestBody:
          $ref: '#/components/requestBodies/MemoPatch'
        responses:
          '200':
            $ref: '#/components/responses/MemoFound'
      head:
        tags: [store]
        summary: Checks that a memo exists with a HEAD request
        operationId: headMemo
        security: []
        responses:
          '200':
            description: The memo exists
            headers:
              X-Revision:
                $ref: '#/components/headers/Revision'
      options:
        tags: [store]
        summary: Lists the methods a memo accepts with an OPTIONS request
        operationId: optionsMemo
        security: []
        responses:
          '204':
            description: The methods are listed in the Allow header
            headers:
              Allow:
                schema:
                  type: string
      trace:
        tags: [store]
        summary: Echoes a memo request with a TRACE request
        operationId: traceMemo
        security: []
        responses:
          '204':
            description: The request was traced
