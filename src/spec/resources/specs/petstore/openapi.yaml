security:
  - petStoreBasic: []
  - petStoreBearer: []

components:
  securitySchemes:
    petStoreBasic:
      type: http
      scheme: basic
    adminBasic:
      type: http
      scheme: basic
    petStoreBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceToken:
      type: http
      scheme: bearer
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    internalApiKey:
      type: apiKey
      in: header
      name: X-Internal-Key
    apiKeyQuery:
      type: apiKey
      in: query
      name: api_key
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION_ID
    machineAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.com/oauth/token
          scopes:
            pets:read: Read pets
            pets:write: Write pets
    legacyAuth:
      type: oauth2
      flows:
        password:
          tokenUrl: https://auth.example.com/oauth/token
          refreshUrl: https://auth.example.com/oauth/refresh
          scopes:
            read: Read access
    userAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.com/authorize
          tokenUrl: https://auth.example.com/oauth/token
          refreshUrl: https://auth.example.com/oauth/refresh
          scopes:
            pets:read: Read pets
            pets:write: Write pets
    browserAuth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://auth.example.com/authorize
          scopes:
            read: Read access
    ssoAuth:
      type: openIdConnect
      openIdConnectUrl: https://auth.example.com/.well-known/openid-configuration

  schemas:

    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        petId:
          type: integer
          format: int64
          example: 198772
        quantity:
          type: integer
          format: int32
          example: 7
        shipDate:
          type: string
          format: date-time
        status:
          type: string
          description: Order Status
          example: approved
          default: placed
          enum:
            - placed
            - approved
            - delivered
        complete:
          type: boolean

    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Dogs
          x-examples:
            small_breed:
              summary: Small breed
              description: Toy or small breed dogs
              value: Chihuahua
            large_breed:
              summary: Large breed
              description: Working or guard breed dogs
              value: GreatDane

    Tag:
      type: object
      deprecated: true
      description: Tags are deprecated, use categories instead
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    Pet:
      required:
        - name
        - photoUrls
      type: object
      externalDocs:
        description: Learn more about the Pet model
        url: https://example.com/docs/pet
      properties:
        id:
          type: integer
          format: int64
          example: 10
        name:
          type: string
          example: doggie
        category:
          $ref: '#/components/schemas/Category'
        photoUrls:
          type: array
          uniqueItems: true
          items:
            type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        status:
          type: string
          description: pet status in the store
          deprecated: true
          enum:
            - available
            - pending
            - sold
        location:
          $ref: '#/components/schemas/GeoPoint'
        # Type-surface exercise fields — each one drives a generator
        # mapping that varies by language (branded URI in Node, HttpUrl in
        # Python, System.Uri in C#, io.ktor.http.Url in Kotlin, etc.).
        homepageUrl:
          type: string
          format: uri
          description: Absolute URL to the pet's public profile page
          example: https://example.com/pets/fido
        # uri-reference may be relative; languages MUST keep this as a
        # plain string surface even though `format: uri` is typed.
        thumbnailRef:
          type: string
          format: uri-reference
          description: Optionally-relative thumbnail location
          example: /assets/thumb-fido.png
        # uri-template (RFC 6570) contains {var} placeholders so no real
        # URI parser will accept it — stays a plain string surface.
        linkTemplate:
          type: string
          format: uri-template
          description: RFC 6570 template for related-resource links
          example: https://example.com/pets/{id}/photos{?size}
        ownerEmail:
          type: string
          format: email
          description: Contact email for the pet's owner
          example: owner@example.com
        # Plain `type: number` without a numeric format — decimal-precision
        # surface. Becomes branded `Decimal` in Node, BigDecimal in
        # Java/Kotlin, decimal.Decimal in Python, etc.
        weightKg:
          type: number
          description: Pet weight in kilograms (decimal precision)
          example: 12.345

    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        type:
          type: string
        message:
          type: string

    DryFood:
      type: object
      required:
        - foodType
        - weightKg
      properties:
        foodType:
          type: string
        weightKg:
          type: number
          format: double

    WetFood:
      type: object
      required:
        - foodType
        - volumeMl
      properties:
        foodType:
          type: string
        volumeMl:
          type: integer
          format: int32

    PetFood:
      description: Food for pets, discriminated by foodType
      oneOf:
        - $ref: '#/components/schemas/DryFood'
        - $ref: '#/components/schemas/WetFood'
      discriminator:
        propertyName: foodType
        mapping:
          dry: '#/components/schemas/DryFood'
          wet: '#/components/schemas/WetFood'

    Medication:
      type: object
      required:
        - drugName
      properties:
        drugName:
          type: string
        dosage:
          type: string

    Surgery:
      type: object
      required:
        - procedureName
      properties:
        procedureName:
          type: string
        durationMinutes:
          type: integer
          format: int32

    PetTreatment:
      description: A treatment that can match a medication, a surgery, or both
      anyOf:
        - $ref: '#/components/schemas/Medication'
        - $ref: '#/components/schemas/Surgery'

    PetWithOwner:
      description: A pet record extended with owner information
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          required:
            - ownerName
          properties:
            ownerName:
              type: string
            ownerEmail:
              type: string
              format: email

    Photo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        caption:
          type: string
        isPrimary:
          type: boolean
        url:
          type: string

    PhotoMetadata:
      type: object
      properties:
        caption:
          type: string
        isPrimary:
          type: boolean
        takenAt:
          type: string
          format: date-time
        location:
          $ref: '#/components/schemas/PhotoMetadataLocation'

    PhotoMetadataLocation:
      type: object
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double

    PetPassport:
      type: object
      properties:
        pet:
          $ref: '#/components/schemas/Pet'
        # Case 14 — byte response, nested in JSON object
        thumbnail:
          type: string
          format: byte
          description: Base64-encoded primary thumbnail
          example: "dGVzdC10aHVtYm5haWw="
        # Case 15 — byte response, array items
        scans:
          type: array
          items:
            type: string
            format: byte
            example: "dGVzdC1zY2Fu"
          description: Base64-encoded scans of each passport page
        issuedAt:
          type: string
          format: date-time
        # Gap BB — OAS 3.1 contentEncoding/contentMediaType.
        # Normalized by the CONTENT_ENCODING rule into format: byte +
        # contentMediaType appended to the docstring. Without the rule,
        # generators that only understand OAS 3.0 would emit a plain
        # String here with no base64 decoding.
        biometricChip:
          type: string
          contentEncoding: base64
          contentMediaType: application/octet-stream
          description: Embedded chip data (OAS 3.1 contentEncoding form)

    Metadata:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
      additionalProperties:
        type: string

    # Gap AX.1 — OAS 3.1 / JSON Schema 2020-12 strict-mode. Deserializers must
    # reject any JSON key not declared here (or inherited via allOf). Used by the
    # generated-client extra-key-rejection test in each language.
    StrictTag:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      unevaluatedProperties: false

    # Gap AZ — OAS 3.1 / JSON Schema 2020-12 `prefixItems` (positional tuple
    # arrays). Normalized by NormalizePrefixItemsRule into a plain
    # `type: array, items: {}` (Object / Any / interface{}) with the original
    # per-index types preserved in the schema description. Heterogeneous
    # fixed-arity tuples have no portable representation across the 12 target
    # languages, so we degrade to a homogeneous array; callers must downcast
    # per index following the docstring.
    GeoPoint:
      type: array
      prefixItems:
        - type: number
          format: double
        - type: number
          format: double
        - type: string

    # Standalone string-enum component (NOT an inline property enum like
    # Order.status). Exercises the top-level enum template path: in Java that
    # path emits @JsonValue / @JsonCreator and must self-import the Jackson
    # annotations, which only the inline-enum and object-model paths did before.
    Color:
      type: string
      description: A standalone, reusable colour enumeration
      enum:
        - red
        - green
        - blue

    # Collected real-world shapes that the petstore previously lacked, each of
    # which broke at least one generator against the Zitadel spec.
    EdgeCases:
      type: object
      description: >-
        Edge-case property shapes mirrored from real protobuf-derived specs.
      properties:
        # Bug 1 — nullable free-form (any-typed) property. Optional + no type
        # ⇒ "mixed" in PHP. The PHP template used to emit `public ?mixed`,
        # a fatal parse error (mixed already includes null). Must come out as
        # bare `mixed`. Legal-but-redundant nullable-any everywhere else.
        freeFormAny:
          description: Arbitrary JSON value; may be absent or null
        # Bug 2 — reference to the standalone enum component above.
        favoriteColor:
          $ref: '#/components/schemas/Color'
        # Bug 3 — description carrying HTML entities, exactly as buf emits
        # quoted/angled proto comment text. Must be decoded to its readable
        # form ("user.grant.write", <admin>, & , don't) in every language's
        # generated comments, and must never appear as a raw entity or as the
        # `\&quot;` that tripped Python's invalid-escape SyntaxWarning.
        permissionsNote:
          type: string
          description: >-
            Required permission is &quot;user.grant.write&quot; for
            &lt;admin&gt; &amp; owner roles (don&#39;t skip it)
        # Bug 4 — properties literally named after language keywords. Python
        # (pydantic v2) rejects a leading-underscore field, so `and`→`_and`
        # crashed at import; the fix mangles to a trailing underscore (`and_`)
        # with the wire name preserved via the field alias.
        and:
          type: boolean
        or:
          type: boolean
        not:
          type: boolean
        class:
          type: string
        return:
          type: string
        # Bug 5 — protobuf Duration ⇒ Python datetime.timedelta (module-
        # qualified), which needs `import datetime`, not `from datetime import
        # timedelta`. Paired with a date-time field.
        retryAfter:
          type: string
          format: duration
          description: Back-off interval before retrying (ISO-8601 duration)
        expiresAt:
          type: string
          format: date-time
          description: Absolute expiry instant
