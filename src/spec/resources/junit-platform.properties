junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=2
# Cap the total pool size to the parallelism. The *ClientSpec / *BuildSpec
# suites block on Docker I/O (waiting for language-runtime + chasm/squid
# containers), which makes the ForkJoinPool spawn compensation threads far
# beyond `parallelism` — observed 8 container suites running at once, which
# OOMs / exhausts Docker on a CI runner and makes a random spec fail each
# run. max-pool-size pins the worker count so concurrency is truly bounded.
junit.jupiter.execution.parallel.config.fixed.max-pool-size=2
