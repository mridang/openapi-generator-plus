build:
  maxIssues: 0

# Generated SDK has many serializer/transport methods with high parameter
# counts and cyclomatic complexity inherent to OpenAPI's wire surface.
# Per-method thresholds are relaxed; correctness rules stay strict.

complexity:
  TooManyFunctions:
    active: false
  LongParameterList:
    active: false
  CyclomaticComplexMethod:
    active: false
  LongMethod:
    active: false
  ComplexCondition:
    active: false
  NestedBlockDepth:
    active: false
  ComplexInterface:
    active: false
  LargeClass:
    active: false

style:
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  UseRequire:
    active: false
  ThrowsCount:
    active: false
  ForbiddenComment:
    active: false
  WildcardImport:
    active: false
