name: petstore_client
description: "A simplified Pet Store API for integration testing. Covers pets & owners, <admin> notes, \"quoted\" text, it's $USD and #{x}."
version: 1.0.0
homepage: "https://acme.example.com/petstore"
repository: "https://git.example.com/acme/petstore-client.git"
issue_tracker: "https://git.example.com/acme/petstore-client/issues"
documentation: "https://docs.example.com/petstore"

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  collection: ^1.18.0
  decimal: ^2.3.3
  http: ^1.2.0
  http_parser: ^4.0.0
  mime: ^1.0.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
  coverage: ^1.11.0
  junitreport: ^2.0.0
  opentelemetry: ^0.18.11
  testcontainers_core: ^1.0.3
