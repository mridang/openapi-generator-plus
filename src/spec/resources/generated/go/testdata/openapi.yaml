openapi: 3.1.0
info:
  title: Swagger Petstore - OpenAPI 3.0
  description: A simplified Pet Store API for integration testing.
  version: 1.0.0
tags:
  - name: pet
    description: Everything about your Pets
    externalDocs:
      description: Find out more about pets
      url: https://example.com/docs/pets
  - name: store
    description: Access to Petstore orders
servers:
  - url: /api/v3
    description: Relative URL (no variables)
  - url: https://{environment}.example.com/api/{version}
    description: Main API server with variables
    variables:
      environment:
        default: api
        description: API environment
        enum:
          - api
          - staging
          - sandbox
      version:
        default: v3
        description: API version
        enum:
          - v2
          - v3
paths:

  # ─── Pet CRUD ────────────────────────────────────────────────────────────────

  /pet:
    post:
      tags:
        - pet
      summary: Add a new pet to the store
      operationId: addPet
      security:
        - apiKeyHeader: []
        - petStoreBearer: []
      requestBody:
        description: Create a new pet in the store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid input

  /pet/findByStatus:
    get:
      tags:
        - pet
      summary: Finds Pets by status
      operationId: findPetsByStatus
      deprecated: true
      externalDocs:
        description: Find out more about filtering
        url: https://example.com/docs/filtering
      parameters:
        - name: status
          in: query
          description: Status values that need to be considered for filter
          required: false
          deprecated: true
          allowEmptyValue: true
          schema:
            type: string
            default: available
            enum:
              - available
              - pending
              - sold
          examples:
            available_only:
              summary: Available only
              description: Show only pets currently in stock
              value: available
            sold_pets:
              summary: Sold pets
              description: Show pets that have been sold
              value: sold
        - name: filter
          in: query
          description: Filter criteria as key-value pairs
          required: false
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid status value

  /pet/{petId}:
    get:
      tags:
        - pet
      summary: Find pet by ID
      description: Returns a single pet
      operationId: getPetById
      deprecated: true
      servers:
        - url: https://cdn.petstore.io/v3
          description: CDN-backed read endpoint for pet details
      parameters:
        - name: petId
          in: path
          description: ID of pet to return
          required: true
          schema:
            type: integer
            format: int64
          examples:
            small_breed:
              summary: Small breed ID
              description: A common small-breed pet identifier
              value: 1
            large_breed:
              summary: Large breed ID
              description: A common large-breed pet identifier
              value: 42
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid ID supplied
        '404':
          description: Pet not found
    put:
      tags:
        - pet
      summary: Update an existing pet
      operationId: updatePet
      parameters:
        - name: petId
          in: path
          description: ID of pet to update
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Pet object that needs to be updated
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid ID supplied
        '404':
          description: Pet not found
    delete:
      tags:
        - pet
      summary: Deletes a pet
      operationId: deletePet
      security:
        - adminBasic: []
        - machineAuth:
            - pets:write
      parameters:
        - name: petId
          in: path
          description: Pet id to delete
          required: true
          schema:
            type: integer
            format: int64
        - name: api_key
          in: cookie
          description: Session cookie used for authentication
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Pet deleted
        '400':
          description: Invalid pet value

  # ─── Avatar ──────────────────────────────────────────────────────────────────
  # Case 1:  binary request,  direct specific MIME  (PUT image/jpeg or image/png)
  # Case 10: byte   request,  nested in JSON object  (PUT application/json with format:byte property)
  # Case 7:  binary response, direct specific MIME  (GET image/jpeg or image/png)

  /pet/{petId}/avatar:
    put:
      tags:
        - pet
      summary: Set the pet's profile photo
      description: >-
        Accepts either raw image bytes (image/jpeg or image/png) or a JSON
        envelope carrying a base64-encoded image for clients that prefer a
        JSON-only workflow.
      operationId: setPetAvatar
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          # Case 1 — binary request, direct specific MIME
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          # Case 10 — byte request, nested in JSON object
          application/json:
            schema:
              type: object
              required:
                - data
                - mimeType
              properties:
                data:
                  type: string
                  format: byte
                  description: Base64-encoded image data
                mimeType:
                  type: string
                  example: image/jpeg
      responses:
        '204':
          description: Avatar updated
        '404':
          description: Pet not found
    get:
      tags:
        - pet
      summary: Get the pet's profile photo
      description: Returns the raw image bytes of the pet's current avatar.
      operationId: getPetAvatar
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            # Case 7 — binary response, direct specific MIME
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Pet not found

  # ─── Avatar thumbnail ────────────────────────────────────────────────────────
  # Case 11: byte request,  top-level bare   (PUT — single base64 string or array)
  # Case 12: byte request,  array items      (PUT — array variant via oneOf)
  # Case 13: byte response, top-level bare   (GET — bare base64 string)

  /pet/{petId}/avatar/thumbnail:
    put:
      tags:
        - pet
      summary: Set the pet's avatar thumbnail as base64
      description: >-
        Accepts either a single base64-encoded thumbnail or an array of
        candidates; the server selects the most suitable one.
      operationId: setPetAvatarThumbnail
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                # Case 11 — byte request, top-level bare
                - type: string
                  format: byte
                  description: Single base64-encoded thumbnail
                # Case 12 — byte request, array items
                - type: array
                  items:
                    type: string
                    format: byte
                  description: Multiple base64-encoded candidates; server picks best
      responses:
        '204':
          description: Thumbnail updated
        '404':
          description: Pet not found
    get:
      tags:
        - pet
      summary: Get the pet's avatar thumbnail as base64
      description: >-
        Returns a compact base64-encoded thumbnail suitable for embedding
        directly in mobile UI without a separate image request.
      operationId: getPetAvatarThumbnail
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                # Case 13 — byte response, top-level bare
                type: string
                format: byte
                example: "dGVzdC1pbWFnZQ=="
        '404':
          description: Pet not found

  # ─── Photo gallery ───────────────────────────────────────────────────────────
  # Case 5: binary request, multipart file + JSON object part  (encoding block)
  # Case 6: binary request, multipart array of files
  # Case 9: binary response, content negotiation (image/* vs application/json)

  /pet/{petId}/photos:
    post:
      tags:
        - pet
      summary: Add photos to the pet's gallery
      description: >-
        Uploads one or more photos with structured metadata. The metadata
        part is serialised as JSON within the multipart body.
      operationId: addPetPhotos
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
                - metadata
              properties:
                # Case 6 — binary request, multipart array of files
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                # Case 5 — binary request, multipart file + JSON object part
                metadata:
                  $ref: '#/components/schemas/PhotoMetadata'
            encoding:
              metadata:
                contentType: application/json
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Photo'
        '404':
          description: Pet not found

  /pet/{petId}/photos/{photoId}:
    get:
      tags:
        - pet
      summary: Get a photo or its metadata
      description: >-
        Returns the raw image bytes or JSON metadata depending on the
        Accept header sent by the client.
      operationId: getPetPhoto
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: photoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            # Case 9 — binary response, content negotiation
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
        '404':
          description: Photo not found

  # ─── Adoption certificate ────────────────────────────────────────────────────
  # Case 3: binary request, multipart single file, no companions

  /pet/{petId}/certificate:
    post:
      tags:
        - pet
      summary: Upload the pet's adoption certificate
      description: >-
        Attaches a single adoption certificate document. No metadata fields
        are required alongside the file.
      operationId: uploadPetCertificate
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                # Case 3 — binary request, multipart single file, no companions
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Pet not found

  # ─── Vet documents ───────────────────────────────────────────────────────────
  # Case 2: binary request,  octet-stream  (POST application/octet-stream)
  # Case 4: binary request,  multipart file + scalar companions
  # Case 8: binary response, octet-stream  (GET application/octet-stream)

  /pet/{petId}/documents:
    post:
      tags:
        - pet
      summary: Attach a vet document or health record
      description: >-
        Accepts either a multipart upload with document classification fields,
        or a raw octet-stream for server-to-server and CLI clients that prefer
        to stream bytes directly.
      operationId: uploadPetDocument
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          # Case 4 — binary request, multipart file + scalar companions
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                documentType:
                  type: string
                  enum:
                    - health_certificate
                    - vaccination_record
                    - microchip_record
                notes:
                  type: string
          # Case 2 — binary request, direct octet-stream
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Pet not found

  /pet/{petId}/documents/{documentId}:
    get:
      tags:
        - pet
      summary: Download a vet document
      description: >-
        Returns the raw document bytes as an octet-stream. The original MIME
        type is communicated via the Content-Type response header.
      operationId: downloadPetDocument
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: documentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            # Case 8 — binary response, octet-stream
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Document not found

  # ─── Pet passport ─────────────────────────────────────────────────────────────
  # Case 14: byte response, nested in JSON object   (thumbnail property)
  # Case 15: byte response, array items             (scans array)

  /pet/{petId}/passport:
    get:
      tags:
        - pet
      summary: Get the pet's passport
      description: >-
        Returns a single JSON document combining the pet's profile with an
        embedded base64 thumbnail and base64-encoded scans of each passport
        page, suitable for mobile clients that prefer a single-request workflow.
      operationId: getPetPassport
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetPassport'
        '404':
          description: Pet not found

  # ─── Pet treatment ──────────────────────────────────────────────────────────

  /pet/{petId}/treatment:
    post:
      tags:
        - pet
      summary: Record a treatment for a pet
      operationId: addPetTreatment
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetTreatment'
      responses:
        '200':
          description: Treatment recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetTreatment'
      security:
        - petstore_auth:
            - write:pets

  # ─── Styled parameters ─────────────────────────────────────────────────────

  /pet/{petId}/tag/{tagName}:
    get:
      tags:
        - pet
      summary: Get a tag for a pet
      operationId: getPetTag
      parameters:
        - name: petId
          in: path
          required: true
          style: matrix
          explode: false
          schema:
            type: integer
            format: int64
        - name: tagName
          in: path
          required: true
          style: label
          schema:
            type: string
        - name: colors
          in: query
          style: pipeDelimited
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: sizes
          in: query
          style: spaceDelimited
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: filter
          in: query
          allowEmptyValue: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

  # ─── Per-operation servers ────────────────────────────────────────────────

  /pet/{petId}/external:
    get:
      servers:
        - url: https://external-api.example.com/v1
      tags:
        - pet
      summary: Get external pet info
      operationId: getExternalPetInfo
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

  /pet/{petId}/staging:
    get:
      servers:
        - url: https://{environment}.example.com/api/{version}
          description: Staging server
          variables:
            environment:
              default: staging
              description: Deployment environment
              enum:
                - staging
                - sandbox
            version:
              default: v3
              description: API version
              enum:
                - v2
                - v3
      tags:
        - pet
      summary: Get staging pet info
      operationId: getStagingPetInfo
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

  /pet/{petId}/multi:
    get:
      servers:
        - url: https://primary.example.com/v1
          description: Primary
        - url: https://{region}.example.com/v1
          description: Regional
          variables:
            region:
              default: us
              description: Geographic region
              enum:
                - us
                - eu
                - ap
      tags:
        - pet
      summary: Get multi-server pet info
      operationId: getMultiServerPetInfo
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

  # ─── Store ───────────────────────────────────────────────────────────────────

  /store/inventory:
    get:
      tags:
        - store
      summary: Returns pet inventories by status
      operationId: getInventory
      security: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32

  /store/order:
    post:
      tags:
        - store
      summary: Place an order for a pet
      operationId: placeOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid Order

  /store/order/{orderId}:
    get:
      tags:
        - store
      summary: Find purchase order by ID
      operationId: getOrderById
      parameters:
        - name: orderId
          in: path
          description: ID of order to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid ID supplied
        '404':
          description: Order not found
    delete:
      tags:
        - store
      summary: Delete purchase order by ID
      operationId: deleteOrder
      parameters:
        - name: orderId
          in: path
          description: ID of the order to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Order deleted
        '400':
          description: Invalid ID supplied
        '404':
          description: Order not found

security:
  - petStoreBasic: []
  - petStoreBearer: []

components:
  securitySchemes:
    petStoreBasic:
      type: http
      scheme: basic
    adminBasic:
      type: http
      scheme: basic
    petStoreBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceToken:
      type: http
      scheme: bearer
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    internalApiKey:
      type: apiKey
      in: header
      name: X-Internal-Key
    apiKeyQuery:
      type: apiKey
      in: query
      name: api_key
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION_ID
    machineAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.example.com/oauth/token
          scopes:
            pets:read: Read pets
            pets:write: Write pets
    legacyAuth:
      type: oauth2
      flows:
        password:
          tokenUrl: https://auth.example.com/oauth/token
          refreshUrl: https://auth.example.com/oauth/refresh
          scopes:
            read: Read access
    userAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.example.com/authorize
          tokenUrl: https://auth.example.com/oauth/token
          refreshUrl: https://auth.example.com/oauth/refresh
          scopes:
            pets:read: Read pets
            pets:write: Write pets
    browserAuth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://auth.example.com/authorize
          scopes:
            read: Read access
    ssoAuth:
      type: openIdConnect
      openIdConnectUrl: https://auth.example.com/.well-known/openid-configuration

  schemas:

    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        petId:
          type: integer
          format: int64
          example: 198772
        quantity:
          type: integer
          format: int32
          example: 7
        shipDate:
          type: string
          format: date-time
        status:
          type: string
          description: Order Status
          example: approved
          default: placed
          enum:
            - placed
            - approved
            - delivered
        complete:
          type: boolean

    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Dogs
          x-examples:
            small_breed:
              summary: Small breed
              description: Toy or small breed dogs
              value: Chihuahua
            large_breed:
              summary: Large breed
              description: Working or guard breed dogs
              value: GreatDane

    Tag:
      type: object
      deprecated: true
      description: Tags are deprecated, use categories instead
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    Pet:
      required:
        - name
        - photoUrls
      type: object
      externalDocs:
        description: Learn more about the Pet model
        url: https://example.com/docs/pet
      properties:
        id:
          type: integer
          format: int64
          example: 10
        name:
          type: string
          example: doggie
        category:
          $ref: '#/components/schemas/Category'
        photoUrls:
          type: array
          uniqueItems: true
          items:
            type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        status:
          type: string
          description: pet status in the store
          deprecated: true
          enum:
            - available
            - pending
            - sold
        location:
          $ref: '#/components/schemas/GeoPoint'

    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        type:
          type: string
        message:
          type: string

    DryFood:
      type: object
      required:
        - foodType
        - weightKg
      properties:
        foodType:
          type: string
        weightKg:
          type: number
          format: double

    WetFood:
      type: object
      required:
        - foodType
        - volumeMl
      properties:
        foodType:
          type: string
        volumeMl:
          type: integer
          format: int32

    PetFood:
      description: Food for pets, discriminated by foodType
      oneOf:
        - $ref: '#/components/schemas/DryFood'
        - $ref: '#/components/schemas/WetFood'
      discriminator:
        propertyName: foodType
        mapping:
          dry: '#/components/schemas/DryFood'
          wet: '#/components/schemas/WetFood'

    Medication:
      type: object
      required:
        - drugName
      properties:
        drugName:
          type: string
        dosage:
          type: string

    Surgery:
      type: object
      required:
        - procedureName
      properties:
        procedureName:
          type: string
        durationMinutes:
          type: integer
          format: int32

    PetTreatment:
      description: A treatment that can match a medication, a surgery, or both
      anyOf:
        - $ref: '#/components/schemas/Medication'
        - $ref: '#/components/schemas/Surgery'

    PetWithOwner:
      description: A pet record extended with owner information
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          required:
            - ownerName
          properties:
            ownerName:
              type: string
            ownerEmail:
              type: string
              format: email

    Photo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        caption:
          type: string
        isPrimary:
          type: boolean
        url:
          type: string

    PhotoMetadata:
      type: object
      properties:
        caption:
          type: string
        isPrimary:
          type: boolean
        takenAt:
          type: string
          format: date-time
        location:
          $ref: '#/components/schemas/PhotoMetadataLocation'

    PhotoMetadataLocation:
      type: object
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double

    PetPassport:
      type: object
      properties:
        pet:
          $ref: '#/components/schemas/Pet'
        # Case 14 — byte response, nested in JSON object
        thumbnail:
          type: string
          format: byte
          description: Base64-encoded primary thumbnail
          example: "dGVzdC10aHVtYm5haWw="
        # Case 15 — byte response, array items
        scans:
          type: array
          items:
            type: string
            format: byte
            example: "dGVzdC1zY2Fu"
          description: Base64-encoded scans of each passport page
        issuedAt:
          type: string
          format: date-time
        # Gap BB — OAS 3.1 contentEncoding/contentMediaType.
        # Normalized by the CONTENT_ENCODING rule into format: byte +
        # contentMediaType appended to the docstring. Without the rule,
        # generators that only understand OAS 3.0 would emit a plain
        # String here with no base64 decoding.
        biometricChip:
          type: string
          contentEncoding: base64
          contentMediaType: application/octet-stream
          description: Embedded chip data (OAS 3.1 contentEncoding form)

    Metadata:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
      additionalProperties:
        type: string

    # Gap AX.1 — OAS 3.1 / JSON Schema 2020-12 strict-mode. Deserializers must
    # reject any JSON key not declared here (or inherited via allOf). Used by the
    # generated-client extra-key-rejection test in each language.
    StrictTag:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      unevaluatedProperties: false

    # Gap AZ — OAS 3.1 / JSON Schema 2020-12 `prefixItems` (positional tuple
    # arrays). Normalized by NormalizePrefixItemsRule into a plain
    # `type: array, items: {}` (Object / Any / interface{}) with the original
    # per-index types preserved in the schema description. Heterogeneous
    # fixed-arity tuples have no portable representation across the 12 target
    # languages, so we degrade to a homogeneous array; callers must downcast
    # per index following the docstring.
    GeoPoint:
      type: array
      prefixItems:
        - type: number
          format: double
        - type: number
          format: double
        - type: string
