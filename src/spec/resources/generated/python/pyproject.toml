[project]
name = "petstore-client"
version = "1.0.0"
description = "A simplified Pet Store API for integration testing."
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "urllib3>=2.1.0,<3.0.0",
    "python_dateutil>=2.8.2",
    "pydantic[email]>=2,<3",
    "typing-extensions>=4.7.1",
    "brotli>=1.0.0",
    "zstandard>=0.19.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1,<3",
    "ruff>=0.15,<0.16",
    "ty>=0.0.1a1",
    "types-python-dateutil>=2.8.0",
    "types-requests>=2.28.0",
    "types-urllib3>=1.26.0",
    "testcontainers>=4.0.0",
    "pytest-cov>=4.0.0",
    "opentelemetry-sdk>=1.20.0",
    "sphinx>=7,<10",
    "furo>=2024.1.29",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["petstore_client*"]

[tool.setuptools.package-data]
petstore_client = ["py.typed"]

# Ruff, mypy and pyright run with their industry-default configuration; no
# custom or relaxed rules, line length or rule selection are declared here.
# The generated modules carry no blanket suppression: every rule applies to
# every file. The three import rules a fixed generated import block cannot
# satisfy (F401, F811, E402) are turned off per file, by name, in the model,
# API and errors modules that emit such a block, never inline.

[[tool.mypy.overrides]]
# brotli ships neither stubs nor a py.typed marker, and the SDK imports it
# behind a try/except. Declaring that here keeps the check on the SDK's own
# code strict rather than silencing the import inline.
module = ["brotli"]
ignore_missing_imports = true

[tool.pytest.ini_options]
cache_dir = ".pytest"
testpaths = ["test", "spec"]
python_files = "test_*.py *_spec.py"
asyncio_mode = "auto"
addopts = "--cov=petstore_client --cov-report=xml:.out/coverage.xml --cov-report=term-missing --junitxml=.out/reports/junit.xml"
