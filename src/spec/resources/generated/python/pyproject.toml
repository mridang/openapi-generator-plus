[project]
name = "petstore-client"
version = "1.0.0"
description = "A simplified Pet Store API for integration testing."
requires-python = ">=3.10"
dependencies = [
    "urllib3>=2.1.0,<3.0.0",
    "python_dateutil>=2.8.2",
    "pydantic>=2",
    "typing-extensions>=4.7.1",
    "brotli>=1.0.0",
    "zstandard>=0.19.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "types-python-dateutil>=2.8.0",
    "types-requests>=2.28.0",
    "types-urllib3>=1.26.0",
    "testcontainers>=4.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["petstore_client*"]

[tool.setuptools.package-data]
petstore_client = ["py.typed"]

[tool.ruff]
line-length = 120
cache-dir = ".ruff"

[tool.ruff.lint]
extend-select = ["B006", "B008", "RUF012"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true
cache_dir = ".mypy"

[tool.pytest.ini_options]
cache_dir = ".pytest"
testpaths = ["test", "spec"]
python_files = "test_*.py *_spec.py"
addopts = "--cov=petstore_client --cov-report=xml:.out/coverage.xml --cov-report=term-missing --junitxml=.out/reports/junit.xml"
