[package]
name = "petstore"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A simplified Pet Store API for integration testing."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "deflate", "zstd", "multipart", "http2", "charset", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
base64 = "0.22"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
urlencoding = "2"
encoding_rs = "0.8"

[features]
default = []
opentelemetry = ["dep:opentelemetry"]

[dependencies.opentelemetry]
version = "0.32"
optional = true

[dev-dependencies]
testcontainers = { version = "0.24", features = ["blocking"] }
