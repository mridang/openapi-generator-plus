[package]
name = "petstore"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[lints.rust]
# Generated OAuth2 token-manager + OIDC authenticator templates declare
# `unsafe impl Send/Sync` for thread-safe interior-mutable state guarded
# by Mutex. Allowed at crate level; callers can re-tighten if they don't
# need OAuth2.
unsafe_code = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
# Enum variant names come from spec strings (SANDBOX, STAGING, etc.) —
# server environment naming convention. Clippy prefers `Sandbox` but
# users expect the spec's literal naming.
upper_case_acronyms = "allow"
# `pedantic` group is intentionally taste-level (missing-backticks-in-docs,
# bare-URL, redundant-closure, panic-in-if). Clippy itself defaults to
# allow; the agent enabled `warn` here but `cargo clippy -- -D warnings`
# promotes back to error. Keep at `allow` for generated code; callers
# can override in their workspace if they want stricter.
pedantic = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
too_many_lines = "allow"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "brotli", "gzip", "deflate", "zstd", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
urlencoding = "2"
encoding_rs = "0.8"

[features]
default = []
opentelemetry = ["dep:opentelemetry"]

[dependencies.opentelemetry]
version = "0.22"
optional = true

[dev-dependencies]
testcontainers = { version = "0.24", features = ["blocking"] }
